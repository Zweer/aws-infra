name: Deploy & Release
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: [Upgrade CDK dependencies]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy_release:
    name: Deploy & Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test code
        run: npm test

      - name: Build code
        run: npm run build

      - name: Lint code
        run: npm run lint

      - name: Release to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release

      - name: Clean up compiled files
        run: npm run clean

      - name: Deploy to AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        run: npx cdk deploy --require-approval never
